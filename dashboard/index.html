<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Marketing Agent — Ops Dashboard</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2b3548; --txt:#e8edf5; --dim:#93a1b8; --ok:#3ddc84; --bad:#ff5d5d; --acc:#5aa9ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  .keybar { margin-left:auto; display:flex; gap:8px; }
  input,select,button { background:#0d1320; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; }
  button { background:var(--acc); border-color:var(--acc); color:#06121f; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; padding:16px 20px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h2 { margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .row input,.row select { flex:1; min-width:120px; }
  pre { background:#0d1320; border:1px solid var(--line); border-radius:8px; padding:10px; max-height:260px; overflow:auto; font-size:12px; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td,th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .note { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <div><h1>AI Marketing Agent — Ops</h1><div class="sub">product dashboard (training dojo is a separate upstream tool)</div></div>
  <div class="keybar">
    <input id="apiKey" type="password" placeholder="X-API-Token (ak_…)" autocomplete="off" />
    <button id="connectBtn">Connect</button>
  </div>
</header>
<main>
  <section class="card"><h2>Health</h2><div id="health" class="note">not connected</div></section>
  <section class="card"><h2>Quota</h2><div id="quota" class="note">—</div></section>
  <section class="card"><h2>Metrics</h2><div id="metrics"><span class="note">—</span></div></section>
  <section class="card"><h2>Route tester</h2>
    <div class="row"><input id="routeDomain" value="linkedin.com" /><input id="routeAction" value="post" /></div>
    <div class="row"><button id="routeBtn">Route</button></div>
    <pre id="routeOut">—</pre>
  </section>
  <section class="card"><h2>Consent</h2>
    <div class="row"><input id="cSubject" placeholder="subject_id" /><input id="cPurpose" placeholder="purpose" value="marketing" /></div>
    <div class="row"><button id="cGrant">Grant</button><button id="cWithdraw" class="ghost">Withdraw</button><button id="cCheck" class="ghost">Check</button></div>
    <pre id="cOut">—</pre>
    <div class="note">Key is kept in memory/sessionStorage only, never persisted to disk by this page.</div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
